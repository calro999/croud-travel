name: Post High-Quality Travel Article to Bluesky

on:
  schedule:
    - cron: '30 * * * *' # 毎時1回（30分）実行し、1時間おきに高頻度配信（ホテル紹介と地域魅力紹介を交互に配信）
  workflow_dispatch:

concurrency:
  group: bluesky-auto-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bluesky-post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests atproto Pillow

      - name: Post to Bluesky
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE || 'travel-cloud.bsky.social' }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD || 'mxll-k37n-tgyx-usol' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/bluesky_poster.py

      - name: Commit and Push History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add bluesky_post_history.txt bluesky_engagement_history.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: record bluesky post & engagement history [skip ci]"
            git pull --rebase origin main || true
            git push origin main || git push || true
          fi
