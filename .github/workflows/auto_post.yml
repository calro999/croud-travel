name: Fetch Rakuten Travel and Build Next.js Site

on:
  schedule:
    - cron: '0 * * * *' # 1時間おきに実行して自動投稿を維持（1日24回）
  workflow_dispatch:
    inputs:
      target_prefecture:
        description: 'Target prefecture code (e.g. hokkaido, aomori). Leave empty for random.'
        required: false
        default: ''

concurrency:
  group: fetch-rakuten-and-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests atproto Pillow

      - name: Run Rakuten Crawler
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          TARGET_PREFECTURE: ${{ github.event.inputs.target_prefecture }}
        run: python rakuten_crawler.py

      - name: Check and Post to Bluesky
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE || 'travel-cloud.bsky.social' }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD || 'mxll-k37n-tgyx-usol' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/bluesky_poster.py || true

      - name: Bundle Posts
        run: node bundle_posts.js

      - name: Notify Search Engines & Submit IndexNow
        run: |
          node notify_search_engines.js || true
          node submit_indexnow_all.js || true

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/posts/ posted_cache.txt public/data/posts.json bluesky_post_history.txt bluesky_engagement_history.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: update travel posts database and bluesky history [skip ci]"
            git pull --rebase origin main || true
            git push origin main || git push || true
          fi

